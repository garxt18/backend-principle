# Local stack: PostgreSQL + the playground. Optional: a local LLM via Ollama.
#   docker compose up --build                     -> app on http://localhost:8080
#   docker compose --profile ai up --build        -> also starts Ollama (then: docker compose exec ollama ollama pull llama3.2)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: ${DB_PASSWORD:-playground}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/playground
      DB_USERNAME: playground
      DB_PASSWORD: ${DB_PASSWORD:-playground}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-long-random-string-of-32+-chars}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
      OLLAMA_BASE_URL: http://ollama:11434
      LOG_FORMAT: ${LOG_FORMAT:-}

  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
