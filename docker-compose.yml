# Local stack: PostgreSQL + the app.  Run:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: ${DB_PASSWORD:-playground}
    ports:
      - "5432:5432"          # so IntelliJ / DBeaver / psql on your laptop can connect too
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives 'docker compose down'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/playground   # 'db' = the service name above (Docker's internal DNS)
      DB_USERNAME: playground
      DB_PASSWORD: ${DB_PASSWORD:-playground}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-long-random-string-of-32+-chars}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      LOG_FORMAT: ${LOG_FORMAT:-}

volumes:
  pgdata:
