# Render Blueprint: Render dashboard -> New -> Blueprint -> pick this repository.
#
# Database: Render's FREE Postgres is deleted 30 days after creation, so this Blueprint does not create one.
# Create a free Postgres at https://neon.tech (never expires, no card) and paste its connection string as
# DATABASE_URL when Render asks. See docs/DEPLOYMENT.md.
#
# Sleeping: a free Render web service sleeps after 15 minutes without traffic and needs ~1 minute to wake up.
# Keep it awake with a free cron-job.org / UptimeRobot ping to /actuator/health/liveness every 10 minutes
# (one service running 24/7 fits in the 750 free instance hours a month). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: backend-playground
    runtime: docker
    plan: free
    region: singapore                # closest Render region to India; create the Neon DB in AWS Singapore too
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DATABASE_URL            # postgresql://user:password@host/db?sslmode=require (from Neon)
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true          # Render creates a long random secret
      - key: APP_SECURE_COOKIE
        value: "true"
      - key: LOG_FORMAT
        value: ecs
      - key: API_DOCS_ENABLED        # no public Swagger UI / OpenAPI JSON in production
        value: "false"
      - key: JAVA_OPTS               # small-memory JVM: 512 MB instance
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      - key: GOOGLE_CLIENT_ID        # optional "Continue with Google" - see docs/DEPLOYMENT.md
        sync: false                  # (Render sets RENDER_EXTERNAL_URL, used for Google's redirect URL)
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_ADMIN_EMAIL
        sync: false                  # you type these in the dashboard when creating the Blueprint
      - key: APP_ADMIN_PASSWORD
        sync: false
