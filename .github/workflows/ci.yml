name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests + integration tests. Testcontainers starts PostgreSQL in Docker,
      # which GitHub's ubuntu runners provide out of the box.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t backend-playground:${{ github.sha }} .
